<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticker Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: #f5f5f5;
      color: #1a1a1a;
      padding: 20px;
    }

    h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #111;
    }

    fieldset {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
      background: #fff;
    }

    legend {
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
      padding: 0 6px;
    }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
    }

    .field-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .field-row:first-child {
      padding-top: 0;
    }

    label {
      flex: 1;
      cursor: pointer;
      user-select: none;
      color: #333;
    }

    input[type="number"],
    input[type="datetime-local"],
    input[type="text"] {
      width: 160px;
      padding: 5px 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 13px;
      background: #fafafa;
      color: #111;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="number"]:focus,
    input[type="datetime-local"]:focus {
      border-color: #555;
      background: #fff;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .label-block {
      display: flex;
      flex-direction: column;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #fff;
      color: #333;
      transition: background 0.15s;
    }

    button:hover {
      background: #eee;
    }

    button[type="submit"] {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    button[type="submit"]:hover {
      background: #333;
    }
  </style>
</head>
<body>
  <h2>Ticker Settings</h2>
  <form id="settings-form">

    <!-- Time -->
    <fieldset>
      <legend>Time</legend>

      <div class="field-row">
        <div class="label-block">
          <label for="use-system-time">Use system time &amp; timezone</label>
          <span class="hint">Automatically syncs to your machine's clock.</span>
        </div>
        <input type="checkbox" id="use-system-time" />
      </div>

      <div class="field-row" id="manual-time-row" style="display:none;">
        <div class="label-block">
          <label for="manual-time">Manual time</label>
          <span class="hint">Set a custom date &amp; time for the clock.</span>
        </div>
        <input type="datetime-local" id="manual-time" />
      </div>

      <div class="field-row">
        <div class="label-block">
          <label for="timezone-offset">Timezone offset (minutes)</label>
          <span class="hint">e.g. +240 for UTC+4, −300 for UTC−5. Leave blank to use system TZ.</span>
        </div>
        <input type="number" id="timezone-offset" step="1" placeholder="e.g. 240" />
      </div>
    </fieldset>

    <!-- Window -->
    <fieldset>
      <legend>Window</legend>

      <div class="field-row">
        <div class="label-block">
          <label for="win-width">Width (px)</label>
          <span class="hint">80 – 800 px</span>
        </div>
        <input type="number" id="win-width" min="80" max="800" step="10" />
      </div>

      <div class="field-row">
        <div class="label-block">
          <label for="win-height">Height (px)</label>
          <span class="hint">80 – 800 px</span>
        </div>
        <input type="number" id="win-height" min="80" max="800" step="10" />
      </div>
      <div class="field-row">
        <div class="label-block">
          <label for="locked-position">Lock position</label>
          <span class="hint">Disables drag &amp; drop; the clock stays put.</span>
        </div>
        <input type="checkbox" id="locked-position" />
      </div>
    </fieldset>

    <div class="actions">
      <button type="button" id="cancel-btn">Cancel</button>
      <button type="submit">Save</button>
    </div>

  </form>
  <script src="settings.js"></script>
</body>
</html>
