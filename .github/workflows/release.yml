name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build application bundle
        run: npm run build

      - name: Extract release notes from CHANGELOG
        run: node scripts/extract-changelog.js "${{ github.ref_name }}" RELEASE_NOTES.md

      - name: Create release distribution archive
        run: tar -czf "ticker-${{ github.ref_name }}.tar.gz" dist scripts package.json package-lock.json README.md CHANGELOG.md LICENSE

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Ticker ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: "ticker-${{ github.ref_name }}.tar.gz"
          draft: false
          prerelease: false
